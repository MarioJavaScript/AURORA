{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">Inventario</p><h1>{{ title }}</h1></div><a href="{{ url_for('lista') }}">Volver a equipos</a></div>
{% if errors %}<div class="errors" role="alert"><strong>Revisa el formulario:</strong><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form class="card editor" method="post"><div class="grid"><label>Clave *<input name="clave" maxlength="30" required value="{{ data.clave|default('', true) }}"></label><label>Tipo *<select name="tipo_id" required><option value="">Seleccionar</option>{% for item in tipos %}<option value="{{ item.id }}" {% if data.tipo_id|default(0)|int == item.id %}selected{% endif %}>{{ item.nombre }}</option>{% endfor %}</select></label><label>Marca *<input name="marca" maxlength="80" required value="{{ data.marca|default('', true) }}"></label><label>Modelo *<input name="modelo" maxlength="100" required value="{{ data.modelo|default('', true) }}"></label><label>Número de serie *<input name="numero_serie" maxlength="100" required value="{{ data.numero_serie|default('', true) }}"></label><label>Estado *<select name="estado_id" required><option value="">Seleccionar</option>{% for item in estados %}<option value="{{ item.id }}" {% if data.estado_id|default(0)|int == item.id %}selected{% endif %}>{{ item.nombre }}</option>{% endfor %}</select></label><label>Ubicación *<input name="ubicacion" maxlength="150" required value="{{ data.ubicacion|default('', true) }}"></label><label>Cliente<input name="cliente" maxlength="150" value="{{ data.cliente|default('', true) }}"></label><label>Fecha de alta *<input type="date" name="fecha_alta" required value="{{ data.fecha_alta|default('', true) }}"></label></div><label>Notas<textarea name="notas" rows="4">{{ data.notas|default('', true) }}</textarea></label><div class="actions"><button type="submit">Guardar equipo</button><a href="{{ url_for('lista') }}">Cancelar</a></div></form>{% endblock %}
